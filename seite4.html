<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dynamische Datenseite - Linz</title>
</head>
<body>

    <h1>Dynamische Datenseite - Linz</h1>

    <!-- 1. Liste für Linzer Stadtteile -->
    <h2>Stadtteile Linz</h2>
    <ul id="liste-linz"></ul>

    <!-- 2. Service-Liste (User aus API) -->
    <h2>Service Linz (Userdaten)</h2>
    <ul id="service-linz"></ul>

      <script>
        // 5.a: Array mit Linzer Stadtteilen + eigene Daten
        const linzStadtteile = [
            "Innenstadt",
            "Urfahr",
            "Bindermichl",
            "Ebelsberg",
            "Pichling",
            "Mein Name: [DEIN NAME]",
            "Name meiner Mutter: [NAME DEINER MUTTER]"
        ];

        const liste = document.getElementById("liste-linz");

        linzStadtteile.forEach(teil => {
            const li = document.createElement("li");
            li.textContent = teil;
            liste.appendChild(li);
        });


        // 5.d: Daten von API laden
        fetch("https://jsonplaceholder.typicode.com/users")
            .then(response => response.json())
            .then(data => {
                const serviceListe = document.getElementById("service-linz");

                data.forEach(user => {
                    const li = document.createElement("li");
                    li.textContent = user.name;
                    serviceListe.appendChild(li);
                });
            })
            .catch(error => {
                console.error("Fehler beim Laden der Daten:", error);
            });
    </script>
</body>
</html>
