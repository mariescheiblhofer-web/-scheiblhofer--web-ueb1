<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dynamische Datenseite - Linz</title>
</head>
<body>

    <h1>Dynamische Datenseite - Linz</h1>

    <!-- 1. Liste für Linzer Stadtteile -->
    <h2>Stadtteile Linz</h2>
    <ul id="liste-linz"></ul>

    <!-- 2. Service-Liste (User aus API) -->
    <h2>Service Linz (Userdaten)</h2>
    <ul id="service-linz"></ul>

   <script>
  // Daten vom Server laden (Servicecall)
  fetch('https://jsonplaceholder.typicode.com/users')
    .then(response => response.json()) // Antwort in JSON umwandeln
    .then(data => {
      const sListe = document.getElementById("service-liste");

      data.forEach(user => {
        let li = document.createElement("li");
        li.textContent = "User: " + user.name; // Name aus API
        sListe.appendChild(li);
      });
    })
    .catch(error => {
      console.error("Fehler beim Laden:", error);
    });
</script>
</body>
</html>
